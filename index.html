<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#15171c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="My Spot" />
    <link rel="stylesheet" href="style.css" />
    <title>Where I Parked</title>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="pmark">P</div>
        <div>
          <h1>Where is my Car?</h1>
          <div class="sub">Saved on this phone only</div>
        </div>
      </header>

      <div class="ticket" id="ticket">
        <div class="stub">
          <div class="status" id="status">
            <span class="dot"></span><span id="statusText">Empty</span>
          </div>
          <div class="when" id="when">—</div>
        </div>

        <div class="body">
          <div class="label">Parking spot</div>
          <div class="spotline">
            <div class="field">
              <input
                id="floor"
                inputmode="text"
                maxlength="4"
                placeholder="B2"
                autocomplete="off"
              />
              <div class="cap">Level</div>
            </div>
            <div class="field">
              <input
                id="zone"
                inputmode="text"
                maxlength="6"
                placeholder="A-17"
                autocomplete="off"
              />
              <div class="cap">Zone · Number</div>
            </div>
          </div>

          <div class="note">
            <textarea
              id="memo"
              placeholder="Note (e.g. next to the elevator)"
              rows="1"
            ></textarea>
          </div>

          <div class="photo" id="photoBox">
            <div class="ph-empty" id="phEmpty">
              <svg
                width="26"
                height="26"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#7a7e88"
                stroke-width="1.8"
              >
                <path d="M3 7h3l2-2h8l2 2h3v12H3z" />
                <circle cx="12" cy="13" r="3.5" />
              </svg>
              Add a photo
            </div>
            <img id="phImg" style="display: none" alt="Parking photo" />
            <button
              class="rm"
              id="phRemove"
              style="display: none"
              aria-label="Remove photo"
            >
              ×
            </button>
          </div>
        </div>

        <div class="perf"></div>
        <div class="actions" style="padding: 0 18px 18px">
          <button class="act b-save" id="bSave">I parked here</button>
          <button class="act b-img" id="bImg">Save as image</button>
          <button class="act b-left" id="bLeft">Left</button>
          <button class="act b-clear" id="bClear">Clear</button>
        </div>
      </div>

      <div class="hint" id="hint">
        <b>How to use it like a widget</b>
        <div id="hintIos">iPhone: Safari Share → <b>Add to Home Screen</b></div>
        <div id="hintAndroid">
          Android: Chrome menu (⋮) → <b>Add to Home screen</b>
        </div>
        <div>An icon appears so it opens in one tap.</div>
        <button class="hint-close" id="hintClose">Got it</button>
      </div>
    </div>

    <input type="file" id="fileInput" accept="image/*" capture="environment" />
    <div class="toast" id="toast"></div>

    <script>
      const KEY = 'parking_spot_v1';
      const $ = (id) => document.getElementById(id);
      let state = { floor: '', zone: '', memo: '', photo: '', savedAt: null };

      function load() {
        try {
          const r = localStorage.getItem(KEY);
          if (r) state = { ...state, ...JSON.parse(r) };
        } catch (e) {}
      }
      function persist() {
        try {
          localStorage.setItem(KEY, JSON.stringify(state));
        } catch (e) {}
      }
      function toast(msg) {
        const t = $('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._t);
        t._t = setTimeout(() => t.classList.remove('show'), 1800);
      }
      function fmt(ts) {
        if (!ts) return '—';
        const d = new Date(ts),
          now = new Date();
        const sameDay = d.toDateString() === now.toDateString();
        let h = d.getHours();
        const ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        const mm = String(d.getMinutes()).padStart(2, '0');
        if (sameDay) return `Today ${h}:${mm} ${ampm}`;
        return `${d.getMonth() + 1}/${d.getDate()} ${h}:${mm} ${ampm}`;
      }
      function render() {
        $('floor').value = state.floor || '';
        $('zone').value = state.zone || '';
        $('memo').value = state.memo || '';
        autoGrow($('memo'));

        if (state.photo) {
          $('phImg').src = state.photo;
          $('phImg').style.display = 'block';
          $('phEmpty').style.display = 'none';
          $('phRemove').style.display = 'block';
        } else {
          $('phImg').style.display = 'none';
          $('phEmpty').style.display = 'flex';
          $('phRemove').style.display = 'none';
        }

        const parked = !!state.savedAt;
        $('status').classList.toggle('on', parked);
        $('statusText').textContent = parked ? 'Parked' : 'Empty';
        $('when').textContent = parked ? fmt(state.savedAt) : '—';
      }
      function autoGrow(el) {
        el.style.height = 'auto';
        el.style.height = Math.max(46, el.scrollHeight) + 'px';
      }

      ['floor', 'zone'].forEach((id) =>
        $(id).addEventListener('input', (e) => {
          state[id] = e.target.value.toUpperCase();
          e.target.value = state[id];
          persist();
        }),
      );
      $('memo').addEventListener('input', (e) => {
        state.memo = e.target.value;
        autoGrow(e.target);
        persist();
      });

      $('bSave').addEventListener('click', () => {
        if (!state.floor && !state.zone && !state.memo && !state.photo) {
          toast('Add a spot or photo first');
          return;
        }
        state.savedAt = Date.now();
        persist();
        render();
        toast('Saved ✓');
      });

      $('phEmpty').addEventListener('click', () => $('fileInput').click());
      $('phImg').addEventListener('click', () => $('fileInput').click());
      $('phRemove').addEventListener('click', () => {
        state.photo = '';
        persist();
        render();
      });
      $('fileInput').addEventListener('change', (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          resizePhoto(ev.target.result, (data) => {
            state.photo = data;
            persist();
            render();
            toast('Photo added ✓');
          });
        };
        reader.readAsDataURL(f);
        e.target.value = '';
      });
      function resizePhoto(dataUrl, cb) {
        const img = new Image();
        img.onload = () => {
          const max = 1000,
            s = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = img.width * s;
          c.height = img.height * s;
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          cb(c.toDataURL('image/jpeg', 0.82));
        };
        img.src = dataUrl;
      }

      function resetAll() {
        state = { floor: '', zone: '', memo: '', photo: '', savedAt: null };
        persist();
        render();
      }
      $('bLeft').addEventListener('click', () => {
        if (!state.savedAt && !state.floor && !state.zone && !state.photo) {
          toast('Nothing parked right now');
          return;
        }
        resetAll();
        toast("You're out: drive safe");
      });
      $('bClear').addEventListener('click', () => {
        if (!confirm('Clear everything and start a new spot?')) return;
        resetAll();
        toast('Cleared: Ready for a new spot');
      });

      $('bImg').addEventListener('click', () => {
        const W = 1080,
          H = 1920;
        const c = document.createElement('canvas');
        c.width = W;
        c.height = H;
        const x = c.getContext('2d');
        x.fillStyle = '#15171c';
        x.fillRect(0, 0, W, H);
        x.fillStyle = '#f4c318';
        x.fillRect(0, 0, W, 16);

        const drawText = () => {
          const cx = W / 2;
          x.textAlign = 'center';
          x.fillStyle = '#a7a59c';
          x.font = '600 38px -apple-system,sans-serif';
          x.fillText('WHERE I PARKED', cx, 150);

          const spot =
            [state.floor, state.zone].filter(Boolean).join('  ') ||
            'No spot set';
          x.fillStyle = '#f4c318';
          x.font = '800 130px -apple-system,sans-serif';
          wrapText(x, spot, cx, 320, W - 120, 130);

          let y = 320 + 140;
          if (state.memo) {
            x.fillStyle = '#eceae3';
            x.font = '500 46px -apple-system,sans-serif';
            y = wrapText(x, state.memo, cx, y + 30, W - 160, 60) + 30;
          }
          if (state.savedAt) {
            x.fillStyle = '#6a6e78';
            x.font = '500 34px -apple-system,sans-serif';
            x.fillText(fmt(state.savedAt), cx, y + 40);
          }
          finish();
        };

        const finish = () => {
          const link = document.createElement('a');
          link.download = 'where-i-parked.png';
          link.href = c.toDataURL('image/png');
          link.click();
          toast('Image saved · set it as your wallpaper');
        };

        if (state.photo) {
          const img = new Image();
          img.onload = () => {
            const ph = 820,
              pw = W - 120,
              px = 60,
              py = H - ph - 80;
            const r = Math.max(pw / img.width, ph / img.height);
            const dw = img.width * r,
              dh = img.height * r;
            x.save();
            roundRect(x, px, py, pw, ph, 40);
            x.clip();
            x.drawImage(img, px + (pw - dw) / 2, py + (ph - dh) / 2, dw, dh);
            x.restore();
            drawText();
          };
          img.onerror = drawText;
          img.src = state.photo;
        } else {
          drawText();
        }
      });
      function wrapText(ctx, text, cx, y, maxW, lh) {
        const words = text.split(/\s+/);
        let line = '',
          yy = y;
        for (const w of words) {
          const test = line ? line + ' ' + w : w;
          if (ctx.measureText(test).width > maxW && line) {
            ctx.fillText(line, cx, yy);
            line = w;
            yy += lh;
          } else line = test;
        }
        if (line) ctx.fillText(line, cx, yy);
        return yy;
      }
      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      // Widget hint: show only the user's OS, and stay hidden once dismissed
      (function () {
        const hint = $('hint');
        try {
          if (localStorage.getItem('hint_dismissed') === '1') {
            hint.style.display = 'none';
            return;
          }
        } catch (e) {}
        const ua = navigator.userAgent || '';
        if (/iPhone|iPad|iPod/i.test(ua))
          $('hintAndroid').style.display = 'none';
        else if (/Android/i.test(ua)) $('hintIos').style.display = 'none';
        $('hintClose').addEventListener('click', () => {
          hint.style.display = 'none';
          try {
            localStorage.setItem('hint_dismissed', '1');
          } catch (e) {}
        });
      })();

      load();
      render();
    </script>
  </body>
</html>
